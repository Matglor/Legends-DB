<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir personaje - Legends DB Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
    <header class="add-page-header">
        <div class="container d-flex justify-content-between align-items-center py-3 gap-3">
            <a class="navbar-brand fw-bold text-white fs-4 text-decoration-none" href="/">
                <i class="fa-solid fa-bolt me-2 text-warning"></i>Legends DB Clone
            </a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Volver a personajes</a>
        </div>
    </header>

    <main class="container add-character-container">
        <div class="mb-4">
            <p class="add-eyebrow mb-2">CHARACTER DATABASE</p>
            <h1 class="display-5 fw-bold text-warning mb-2">Añadir personaje</h1>
            <p class="text-secondary mb-0">Completa la información para registrar un personaje nuevo en la base de datos.</p>
        </div>

        <section class="add-character-panel">
            <form id="addCharacterForm">
                <div class="row g-4">
                    <div class="col-12 col-md-6">
                        <label for="newCharId" class="form-label">ID del personaje</label>
                        <input id="newCharId" class="form-control add-input" type="text" placeholder="Ej. DBL55-01S" maxlength="30" required>
                        <div class="form-text">Debe ser único, por ejemplo DBL99-01L.</div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="newCharName" class="form-label">Nombre del personaje</label>
                        <input id="newCharName" class="form-control add-input" type="text" placeholder="Ej. Super Saiyan Goku" maxlength="120" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="newCharType" class="form-label">Elemento / color</label>
                        <select id="newCharType" class="form-select add-input" required>
                            <option value="" selected disabled>Selecciona un elemento</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="newCharRarity" class="form-label">Rareza</label>
                        <select id="newCharRarity" class="form-select add-input" required>
                            <option value="" selected disabled>Selecciona una rareza</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="add-options">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="newCharZenkai">
                                <label class="form-check-label" for="newCharZenkai">Tiene Zenkai</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="newCharLfLl">
                                <label class="form-check-label" for="newCharLfLl">Es LF / LL (Legends Limited)</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="formMessage" class="mt-4" role="status" aria-live="polite"></div>
                <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-3 add-form-actions">
                    <a href="/" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button id="saveCharacterButton" type="submit" class="btn btn-warning fw-bold px-4">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Guardar personaje
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="text-center py-4 mt-5">
        <div class="container"><p class="mb-0">&copy; <span id="currentYear"></span> Legends Database Clone.</p></div>
    </footer>
    <script src="/static/add-character.js"></script>
</body>
</html>
